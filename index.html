<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kigali Eats · Orders</title>
  </head>
  <body class="min-h-screen bg-stone-50 text-stone-900">
    <main class="mx-auto max-w-5xl space-y-8 p-4 sm:p-8">
      <h1 class="text-2xl font-bold sm:text-3xl">Kigali Eats orders</h1>
      <section id="stats" class="grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-4"></section>
      <section class="rounded-lg border border-stone-200 bg-white p-5">
        <h2 class="mb-4 font-semibold">Delivered revenue by district</h2>
        <div id="districts" class="space-y-3"></div>
      </section>
      <section class="rounded-lg border border-stone-200 bg-white p-5">
        <div class="mb-4 flex flex-wrap items-center justify-between gap-3">
          <h2 class="font-semibold">Orders</h2>
          <div id="filters" class="flex flex-wrap gap-2"></div>
        </div>
        <div class="overflow-x-auto">
          <table class="w-full text-left text-sm">
            <thead class="border-b border-stone-200 text-stone-500">
              <tr><th class="py-2 pr-4">Order</th><th class="pr-4">Customer</th><th class="pr-4">District</th><th class="pr-4 text-right">Total (RWF)</th><th>Status</th></tr>
            </thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
      </section>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
